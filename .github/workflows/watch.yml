name: watch

on:
  schedule:
    - cron: "3-59/10 * * * *"   # 10분마다 3·13·23…분 (정각 몰림 피함, 스케줄 재등록)
  workflow_dispatch:         # Actions 탭에서 수동 실행
    inputs:
      test:
        description: "true면 시간 조건 무시하고 바로 한 통 보냄"
        default: "false"

concurrency:              # 앞 실행이 안 끝났으면 다음 실행은 기다린다 (취소하지 않음)
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python watch.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUBWAY_KEY: ${{ secrets.SUBWAY_KEY }}
          BUS_KEY: ${{ secrets.BUS_KEY }}
          TEST: ${{ github.event.inputs.test == 'true' && '1' || '0' }}
